</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif}
a{color:#222;text-decoration:none}a:hover{color:#222}
.sec{position:relative;background:#fff;border-radius:12px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px}
.sec::before{content:"";position:absolute;left:0;top:20px;width:4px;height:26px;background:#E8363D;border-radius:0 2px 2px 0}
.sec h2{margin:0;font-size:22px;font-weight:700}
.hint{display:flex;align-items:center;gap:6px;font-size:16px;color:#888}
.hint svg{width:16px;height:16px;stroke:#888;fill:none;stroke-width:1.8}
.in{box-sizing:border-box;width:100%;height:48px;border:1px solid #bbb;border-radius:4px;padding:0 12px;font-size:18px;font-family:inherit;background:#fff}
.in::placeholder{color:#999}
.rad{display:flex;align-items:center;gap:10px;font-size:19px}
.rad input{width:20px;height:20px;margin:0;accent-color:#E8363D}
.rad small{font-size:15px;color:#888;margin-left:6px}
.pr{display:flex;align-items:center;gap:8px;font-size:18px}
.pr input{width:18px;height:18px;margin:0;accent-color:#E8363D}
.pr span.u{width:140px;color:#222}
.pr span.n{width:80px}
.pr span.p{color:#222}
</style>
</helmet>
<div style="width:820px;height:2560px;box-sizing:border-box;background:#F5F5F5;position:relative;overflow:hidden">

<label class="rad"><input type="radio" name="when">預約發送<small>指定日期與時間發送</small></label>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px;padding-left:28px">
<div style="position:relative"><label for="d1" style="position:absolute;left:-9999px">日期</label><input class="in" id="d1" type="text" value="2026/11/16" style="background:#f0f0f0;color:#999;border-color:#ddd"><svg aria-hidden="true" style="position:absolute;right:12px;top:14px;width:18px;height:18px;stroke:#666;fill:none;stroke-width:1.8" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></div>

<div style="position:relative"><label for="tpl" style="position:absolute;left:-9999px">範本</label><select id="tpl" class="in" style="appearance:none;-webkit-appearance:none"><option>系統預設</option><option>20200124團</option><option>常用簡訊</option></select><span aria-hidden="true" style="position:absolute;right:14px;top:20px;border:6px solid transparent;border-top-color:#222"></span></div>
<label for="body" style="position:absolute;left:-9999px">簡訊內容</label>
<textarea id="body" rows="14" style="box-sizing:border-box;width:100%;border:1px solid #bbb;border-radius:4px;padding:12px;font-size:19px;line-height:1.6;font-family:inherit;resize:none">雄獅貴賓您好，我是您11/14(六)-11/20(五)經典雪梨浪漫魅力城市7日的領隊薛永南，以下幾點關於行前小提醒：
1. 當天06:50請準時於.........
2. 建議帶........
3. 建議帶........
當天敬請保持手機通暢方便聯絡，謝謝您</textarea>
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:18px">139 / 300 字</span><button type="button" style="height:38px;padding:0 14px;border:1px solid #E8363D;border-radius:8px;background:#fff;color:#E8363D;font-size:18px;font-family:inherit">預覽</button></div>
<label class="rad" style="font-size:18px"><input type="checkbox">系統發送請勿回覆</label>
<label class="rad" style="font-size:18px"><input type="checkbox" disabled>儲存此次修改</label>
</section>
<section class="sec">
<h2>Step-3：選擇發送名單</h2>
<div style="background:#f0f0f0;border-radius:8px;padding:14px 12px;display:flex;flex-direction:column;gap:8px"><label for="lp" style="font-size:19px">領隊手機</label><input class="in" id="lp" type="text" placeholder="請輸入手機號碼"></div>
<div class="hint" style="margin-top:6px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>至少要選擇1位才可發送簡訊</div>
<label class="pr"><input type="checkbox">全選</label>
<div class="pr" style="color:#888;font-size:16px"><span style="width:18px"></span><span class="u">單位</span><span class="n">姓名</span><span>手機</span></div>
<sc-for list="{{pax}}" as="p" hint-placeholder-count="16"><label class="pr"><input type="checkbox"><span class="u">{{p.u}}</span><span class="n">{{p.n}}</span><span class="p">{{p.t}}</span></label></sc-for>
</section>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:80px;background:#F5F5F5;display:flex;align-items:center;padding:0 20px">
<a href="SmsResult.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;height:46px;border-radius:23px;background:#E8363D;color:#fff;font-size:21px;font-weight:700">發送簡訊</a>
</div>
</div>
