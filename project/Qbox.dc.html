<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Q信箱</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif}
a{color:#222;text-decoration:none}a:hover{color:#222}
.msg{border:1px solid #ccc;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.r{display:flex;font-size:18px;line-height:1.4}
.r .k{width:84px;flex:none;color:#222}
</style>
</helmet>
<div style="width:820px;height:1180px;box-sizing:border-box;background:#F5F5F5;position:relative;overflow:hidden">
<header style="height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:relative">
<a href="#back" aria-label="返回" style="width:42px;height:42px;border-radius:21px;background:#3b3b3b;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:0;right:0;text-align:center;margin:0;font-size:22px;font-weight:700;color:#222;pointer-events:none">Q信箱</h1>
<div style="display:flex;gap:12px">
<a href="Notify.dc.html" aria-label="通知" style="position:relative;width:42px;height:42px;border-radius:21px;background:#fff;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg><span style="position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:4px;background:#E8363D"></span></a>
<button type="button" aria-label="離線模式" style="width:42px;height:42px;border-radius:21px;border:0;background:#FDE4E6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8363D" stroke-width="1.8"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg></button>
</div>
</header>
<section style="position:relative;margin:10px 20px 0;background:#fff;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px">
<span aria-hidden="true" style="position:absolute;left:0;top:18px;width:4px;height:24px;background:#E8363D;border-radius:0 2px 2px 0"></span>
<h2 style="margin:0;font-size:22px;font-weight:700">Q信箱</h2>
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="5">
<div class="msg">
<div class="r"><span class="k">訂單號碼</span><span>{{m.order}}</span></div>
<div class="r"><span class="k">時間</span><span>{{m.time}}</span></div>
<div class="r"><span class="k">業務</span><span>{{m.sales}}</span></div>
<div class="r"><span class="k">輸入</span><span>{{m.by}}</span></div>
<div class="r"><span class="k">內容</span><span style="white-space:pre-line">{{m.body}}</span></div>
</div>
</sc-for>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
renderVals() {
  return { msgs: [
    { order: '公告', time: '10/27 10:56', sales: '', by: '客製台北劉玟君', body: '請業務協助入名單，謝謝\n並盡快提供各火車人數，台鐵已開放訂票，目前皆為訂散票' },
    { order: '公告', time: '10/27 10:57', sales: '', by: '客製台北劉玟君', body: 'DEAR~ 請協助核派一名領隊，出發地為台北，謝謝~' },
    { order: '公告', time: '11/05 17:19', sales: '', by: '國內OP陳怡巧', body: '此團已於 2026/11/05 17:19 分房完成' },
    { order: '公告', time: '11/06 18:14', sales: '', by: '國內OP陳怡巧', body: '此團已投保OK,若有資料異動，請務必通知，以便更新保險，感謝！' },
    { order: '6-12656963', time: '10/27 11:41', sales: '企服台北二謝宇宸', by: '企服台北二謝宇宸', body: 'DEAR' }
  ] };
}
}
</script>
</body>
</html>
